[project]
name = "kraken"
version = "0.1.0"
description = "Unofficial Python client for the Kraken REST and Websockets (v2) API."
authors = [{name = "Trevor Sands", email = "trevor@bitshift.software"}]
readme = "README.md"
license = "MIT"

requires-python = ">=3.12"
dependencies = [
    "httpx == 0.28.1",
    "pydantic == 2.12.0",
    "requests == 2.31.0",
    "websockets == 14.2"
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio"
]
lint = [
  "ruff"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 99
indent-width = 4
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
